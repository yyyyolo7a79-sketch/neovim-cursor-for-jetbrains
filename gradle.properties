# Gradle 构建 JVM 参数：插件构建需要较大堆内存
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m

# 构建性能：并行 + 缓存
org.gradle.parallel=true
org.gradle.caching=true

# 目标 IntelliJ 平台版本（本机已安装的 IDEA 2025.2.1，build 252）
# 使用 local() 指向本地安装，避免下载数 GB 的 IDE 分发包
platformVersion=2025.2.1

# 插件元信息
pluginGroup=com.github.yyyolo7a79
pluginName=Neovide Cursor
pluginVersion=0.4.2
